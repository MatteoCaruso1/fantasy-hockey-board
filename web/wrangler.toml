# Shared fantasy hockey board (free Workers plan). Deploy with: node web/deploy.mjs
name = "hockey-board"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[kv_namespaces]]
binding = "BOARD"
id = "<your-kv-namespace-id>"

# auto moves queue + Yahoo login (schema.sql)
[[d1_databases]]
binding = "DB"
database_name = "board-moves"
database_id = "<your-d1-database-id>"

# runs queued auto moves that are due (worker.js scheduled -> runMoves)
[triggers]
crons = ["* * * * *"]

[vars]
# not a secret: it only keeps random visitors from overwriting the saved board (the page sends it)
WRITE_KEY = "<choose-a-random-string>"
